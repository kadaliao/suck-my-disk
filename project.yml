name: SuckMyDisk
options:
  bundleIdPrefix: com.kadaliao
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  DiskCore:
    path: Packages/DiskCore
settings:
  base:
    MARKETING_VERSION: "0.6.2"
    CURRENT_PROJECT_VERSION: "14"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: HMDAVG9B8J
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Xingyi Liao (6E3YWQMDNT)"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  SuckMyDisk:
    type: application
    platform: macOS
    sources:
      - App
      # The helper's launchd job, where SMAppService looks for it.
      - path: Helper/com.kadaliao.SuckMyDisk.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: DiskCore
        product: DiskCore
      # Runs as root once the person turns it on in Settings; next to the app's own program.
      - target: SuckMyDiskHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.SuckMyDisk
        PRODUCT_NAME: SuckMyDisk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SuckMyDisk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Kada Liao"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "SuckMyDisk asks Finder to empty the Trash, and to move apps that belong to the system to the Trash when you uninstall them."
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  SuckMyDiskHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
    dependencies:
      - package: DiskCore
        product: Privileged
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.SuckMyDisk.helper
        PRODUCT_NAME: com.kadaliao.SuckMyDisk.helper
        SKIP_INSTALL: YES
        # An Info.plist inside the program: its bundle id becomes the signing identifier the app
        # checks. Without it codesign makes one up from the file name.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_CFBundleDisplayName: SuckMyDisk Helper
        # Xcode gives a command-line tool an application-identifier entitlement; the helper has none.
        ENTITLEMENTS_REQUIRED: NO
