name: SuckMyDisk
options:
  bundleIdPrefix: com.kadaliao
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  DiskCore:
    path: Packages/DiskCore
settings:
  base:
    MARKETING_VERSION: "0.6.2"
    CURRENT_PROJECT_VERSION: "14"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: HMDAVG9B8J
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: Xingyi Liao (6E3YWQMDNT)"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  SuckMyDisk:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: DiskCore
        product: DiskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.SuckMyDisk
        PRODUCT_NAME: SuckMyDisk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SuckMyDisk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Kada Liao"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "SuckMyDisk asks Finder to empty the Trash, and to move apps that belong to the system to the Trash when you uninstall them."
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
